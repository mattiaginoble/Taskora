<app-dialog
  [title]="summary().progetto || 'Senza progetto'"
  [eyebrow]="eyebrow()"
  size="lg"
  (closed)="closed.emit()"
>
  <div class="detail">
    <section class="summary" aria-label="Riepilogo del progetto">
      <app-status-badge [status]="summary().stato" />
      <span class="muted">{{ done() }} di {{ records().length }} task completate</span>
      <app-schedule-bar class="bar" [task]="summary()" />
      <span class="muted">Prossima scadenza {{ formatDate(summary().scadenza) }}</span>
      <span class="muted">Ore {{ hours() }}</span>
    </section>

    <div class="columns">
      <section class="list">
        <div class="list-head">
          <h3>Task</h3>
          <button type="button" class="btn btn-sm" (click)="creating.set(true)">
            + Nuova task
          </button>
        </div>
        <ul class="tasks">
          @for (item of tasks(); track item.task.id) {
            <li>
              <button
                type="button"
                class="task"
                [class.active]="item.task.id === selectedId()"
                [class.done]="item.task.stato === 'Completato'"
                (click)="select(item.task.id, current)"
              >
                <span class="task-title">{{ item.task.titolo }}</span>
                <span class="task-meta">
                  <app-status-badge [status]="item.task.stato" />
                  <app-priority-badge [priority]="item.task.priorita" />
                  <span [class.overdue]="item.overdue">{{ formatDate(item.task.scadenza) }}</span>
                  <span>· {{ item.owner }}</span>
                </span>
                <app-schedule-bar class="task-bar" [task]="item.task" />
              </button>
            </li>
          }
        </ul>
      </section>

      <section class="current" #current>
        @if (selected(); as task) {
          <app-task-editor [task]="task" />
        }
      </section>
    </div>
  </div>
</app-dialog>

@if (creating()) {
  <app-new-task
    [project]="summary().progetto"
    [sector]="summary().settori[0] ?? ''"
    [owner]="records()[0]?.utente ?? ''"
    (created)="onCreated($event)"
    (closed)="creating.set(false)"
  />
}
