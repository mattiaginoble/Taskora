name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Controllo sintassi PHP
        run: for f in api/*.php config.php; do php -l "$f"; done
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
      # Cartella dist/ pronta da caricare su Aruba (scaricabile dalla pagina dell'esecuzione)
      - uses: actions/upload-artifact@v4
        with:
          name: taskora
          path: dist/
          include-hidden-files: true
